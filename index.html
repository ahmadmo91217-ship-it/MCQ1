<!DOCTYPE html>

<head>

<title>بنك أسئلة الميكروبيولوجي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#0f1a3a;--mute:#5a6585;--line:#dde3f0;--brand:#2b50d8;--brand-ink:#fff;--soft:#e6ecfd;--ok:#0f9d6b;--okbg:#dcf5ea;--bad:#d6364a;--badbg:#fde5e8;--amber:#f2a900;--l1:#2b50d8;--l2:#7a46d1;--l3:#0b7f8b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0b1226;--card:#131c38;--ink:#e8edff;--mute:#9aa8d0;--line:#26335f;--brand:#6f93ff;--brand-ink:#07102b;--soft:#1b2750;--ok:#4fd6a0;--okbg:#11332a;--bad:#ff7a8a;--badbg:#3a1822;--amber:#ffc83d;--l1:#6f93ff;--l2:#b794f6;--l3:#3cc9d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:20px clamp(14px,3vw,28px) 100px}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;margin:8px 0 4px;line-height:1.2}
.sub{color:var(--mute);margin:0 0 22px}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#101d5c,#2b50d8 62%,#3d7bf2);color:#fff;border-radius:20px;padding:clamp(18px,3vw,28px);margin-bottom:18px;box-shadow:0 10px 28px rgba(43,80,216,.25)}
.hero h1{margin:0;color:#fff;font-size:clamp(24px,5vw,34px)}
.hero .sub{color:#d6e0ff;margin:4px 0 0}
.hero .dish{flex:none;width:64px;height:64px;border-color:#fff}
.btn{box-shadow:0 4px 14px rgba(43,80,216,.22)}
.btn.alt{box-shadow:none}
.dish{width:54px;height:54px;border-radius:50%;border:3px solid var(--brand);background:radial-gradient(circle at 30% 35%,var(--amber) 0 5px,transparent 6px),radial-gradient(circle at 62% 58%,var(--brand) 0 7px,transparent 8px),radial-gradient(circle at 40% 70%,var(--l2) 0 4px,transparent 5px),var(--soft)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 12px;font-weight:800}
.chips{display:grid;gap:8px}
.chip{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit;text-align:start;width:100%}
.chip .sw{width:12px;height:36px;border-radius:6px;flex:none}
.chip b{display:block;font-weight:600}.chip small{color:var(--mute)}
.chip[aria-pressed=true]{border-color:var(--brand);background:var(--soft)}
.chip .ck{margin-inline-start:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--brand-ink)}
.chip[aria-pressed=true] .ck{background:var(--brand);border-color:var(--brand)}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label.f{font-size:13px;color:var(--mute);display:block}
input[type=number]{width:100%;font:inherit;font-size:18px;font-weight:600;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;border-radius:9px;padding:10px;font:inherit;font-weight:600;background:transparent;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.tg:first-of-type{border-top:0}
.tg input{width:22px;height:22px;accent-color:var(--brand)}
.info{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin:4px 2px 12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:18px;font-weight:800;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:16px;font-weight:600}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;cursor:pointer;padding:4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.ans{background:var(--brand)}.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}
.dot.cur{outline:3px solid var(--amber);outline-offset:1px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);direction:ltr;text-align:left}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--brand-ink);border-radius:999px;padding:2px 10px;margin-bottom:10px}
.qt{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(16px,1.9vw,18px);line-height:1.5;margin:0 0 12px;font-weight:600;overflow-wrap:anywhere}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:clamp(12px,1.8vw,16px);margin-bottom:10px;font:inherit;font-size:clamp(15px,1.7vw,17px);line-height:1.45;cursor:pointer}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--brand);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);color:var(--brand-ink)}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no .L{background:var(--bad);color:var(--brand-ink)}
.opt:disabled{cursor:default}
.qn{font-weight:800;margin-right:8px;color:var(--brand)}
.qcard .opt{border:0;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;padding:9px 6px;margin:0;align-items:center}
.qcard .opt:last-child{border-bottom:0}
.qcard .opt .L{background:transparent;border:2px solid var(--ink);color:var(--ink);width:30px;height:30px}
.qcard .opt:hover:not(:disabled){background:var(--soft)}
.qcard .opt.sel{background:var(--soft)}
.qcard .opt.sel .L{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.qcard .opt.ok{background:var(--okbg)}
.qcard .opt.ok .L{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.qcard .opt.no{background:var(--badbg)}
.qcard .opt.no .L{background:var(--bad);border-color:var(--bad);color:var(--brand-ink)}
.ansbox{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--okbg);color:var(--ok);font-weight:600;direction:ltr;text-align:left;overflow-wrap:anywhere}
.opt span:last-child{flex:1;min-width:0;overflow-wrap:anywhere;white-space:normal}
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;max-width:920px;margin:0 auto}
.nav .btn{font-size:16px;padding:13px}
.ring{width:170px;height:170px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center}
.ring div{width:132px;height:132px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:38px;font-weight:800}
.res{text-align:center}
.rv{direction:ltr;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;border-inline-start:6px solid var(--bad)}
.rv.good{border-inline-start-color:var(--ok)}
.rv p{margin:2px 0}.rv .y{color:var(--bad)}.rv .g{color:var(--ok);font-weight:600}
.acts{display:grid;gap:10px;margin:16px 0}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.dot{transition:background .15s,border-color .15s}}
body.desk{background:#c7ced9}
@media (prefers-color-scheme:dark){body.desk{background:#10151f}}
.wrap.paper{--m:clamp(30px,7vw,66px);--inkp:#1b2340;--pen:#1d3fbf;--red:#c8202f;--grn:#137a42;max-width:820px;width:calc(100% - 20px);margin:14px auto 110px;padding:24px clamp(14px,3vw,30px) 30px var(--m);background-color:#fffdf7;background-image:linear-gradient(90deg,transparent calc(var(--m) - 12px),#e8a5a5 calc(var(--m) - 12px),#e8a5a5 calc(var(--m) - 10px),transparent calc(var(--m) - 10px));border-radius:3px;box-shadow:0 1px 0 #fff inset,0 14px 34px rgba(15,26,58,.28);direction:ltr;text-align:left;color:var(--inkp)}
.sheet-head{border-bottom:3px double var(--inkp);padding-bottom:12px;margin-bottom:14px}
.sheet-head h2{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(15px,3.2vw,21px);letter-spacing:.05em;margin:0 0 10px;text-align:center;font-weight:600;color:var(--inkp)}
.fill{display:flex;gap:16px;flex-wrap:wrap;font-family:"Source Serif 4",Georgia,serif;font-size:14px}
.fill span{flex:1;min-width:130px;border-bottom:1px solid var(--inkp);padding-bottom:2px}
.ins{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:13px;margin:10px 0 0;color:#4a4a3e}
.paper .top b{font-family:"Source Serif 4",Georgia,serif;font-size:17px}
.paper .link{color:var(--pen)}
.paper .dot{background:#d8d2bf;border-radius:3px}
.paper .dot.ans{background:var(--pen)}.paper .dot.ok{background:var(--grn)}.paper .dot.no{background:var(--red)}
.paper .dot.cur{outline:2px solid var(--inkp);outline-offset:1px}
.paper .qcard{background:none;border:0;padding:0}
.paper .tag{background:none!important;color:var(--inkp);border:1px solid var(--inkp);border-radius:2px;padding:1px 8px}
.paper .qt{color:var(--inkp);font-size:clamp(18px,2.4vw,24px)}
.paper .opt{border:0;background:transparent;color:var(--inkp);border-radius:6px;padding:9px 6px;margin-bottom:3px;font-family:"Source Serif 4",Georgia,serif}
.paper .opt:hover:not(:disabled){background:rgba(29,63,191,.07)}
.paper .opt .L{background:transparent;border:2px solid var(--inkp);color:var(--inkp);font-family:Cairo,sans-serif}
.paper .opt.sel{background:transparent;color:var(--pen)}
.paper .opt.sel .L{background:var(--pen);border-color:var(--pen);color:#fff}
.paper .opt.ok{background:transparent;color:var(--grn)}
.paper .opt.ok .L{background:var(--grn);border-color:var(--grn);color:#fff}
.paper .opt.no{background:transparent;color:var(--red)}
.paper .opt.no .L{background:var(--red);border-color:var(--red);color:#fff}
.paper .opt.ok span:last-child::after{content:"  \2713";font-weight:800}
.paper .opt.no span:last-child::after{content:"  \2717";font-weight:800}
.paper .btn{background:var(--pen);color:#fff;box-shadow:none;border-radius:6px}
.paper .btn.alt{background:transparent;color:var(--inkp);border:2px solid var(--inkp)}
.paper .nav{background:#ebe6d5;border-top:2px solid #cfc8b0}
.paper h1{color:var(--red);font-family:"Source Serif 4",Georgia,serif;text-align:center}
.paper .sub{color:#5b5642;text-align:center}
.paper .ring{background:none!important;border:5px solid var(--red);width:150px;height:150px;transform:rotate(-6deg)}
.paper .ring div{background:none;color:var(--red);width:auto;height:auto;font-family:"Source Serif 4",Georgia,serif}
.paper .panel{background:transparent;border:0;border-bottom:2px solid var(--inkp);border-radius:0;padding:6px 0}
.paper .panel h2{color:var(--inkp)}
.paper .rv{background:transparent;border:0;border-bottom:1px dashed #b9b29a;border-radius:0;padding:10px 0 10px 4px}
.paper .rv::before{content:"\2717";color:var(--red);font-weight:800;float:left;margin-right:10px;font-size:22px;line-height:1.2}
.paper .rv.good::before{content:"\2713";color:var(--grn)}
.paper .rv p{margin-left:30px}
.paper .rv .y{color:var(--red)}.paper .rv .g{color:var(--grn)}
</style>

<script>
const Q=[{"n": 1, "l": 1, "q": "Which of the following represents the five major groups of organisms responsible for human infectious diseases according to the lecture?", "o": ["Bacteria, viruses, fungi, protozoa, and helminths", "Bacteria, algae, plants, fungi, and viruses", "Viruses, plants, protozoa, algae, and fungi", "Bacteria, insects, fungi, algae, and protozoa"], "a": 0, "k": "five major groups"}, {"n": 2, "l": 1, "q": "Which characteristic distinguishes eukaryotic cells from prokaryotic cells?", "o": ["Presence of ribosomes", "Presence of cytoplasm", "Presence of a membrane-bound nucleus", "Presence of genetic material"], "a": 2, "k": "distinguishes eukaryotic cells"}, {"n": 3, "l": 1, "q": "The genetic material of a typical bacterial cell is organized as:", "o": ["Multiple linear chromosomes enclosed in a nucleus", "A single naked circular chromosome without a nuclear membrane", "RNA enclosed in a nuclear membrane", "Multiple chromosomes surrounded by mitochondria"], "a": 1, "k": "genetic material"}, {"n": 4, "l": 1, "q": "The main structural component of the bacterial cell wall is:", "o": ["Cellulose", "Chitin", "Peptidoglycan", "Phospholipid"], "a": 2, "k": "main structural component"}, {"n": 5, "l": 1, "q": "Bacteria reproduce primarily through:", "o": ["Mitosis", "Meiosis", "Binary fission", "Budding"], "a": 2, "k": "reproduce primarily"}, {"n": 6, "l": 1, "q": "Which of the following is a characteristic of eukaryotic cells?", "o": ["Absence of mitochondria", "Presence of a true nucleus and membrane-bound organelles", "Presence of only 70S ribosomes in the cytoplasm", "Absence of nuclear membrane"], "a": 1, "k": "eukaryotic cells"}, {"n": 7, "l": 1, "q": "Which bacterial shape is characterized by a tightly coiled structure?", "o": ["Cocci", "Bacilli", "Spirochaetes", "Vibrios"], "a": 2, "k": "tightly coiled"}, {"n": 8, "l": 1, "q": "Which of the following statements about bacteria is scientifically correct?", "o": ["All bacteria possess mitochondria.", "Bacteria are unicellular prokaryotic organisms.", "Bacteria contain a true nucleus.", "Bacteria reproduce exclusively by mitosis."], "a": 1, "k": "scientifically correct"}, {"n": 9, "l": 1, "q": "Viruses are classified as:", "o": ["Unicellular organisms", "Multicellular organisms", "non-cellular infectious agents", "Eukaryotic microorganisms"], "a": 2, "k": "classified as"}, {"n": 10, "l": 1, "q": "What is the primary function of the viral capsid?", "o": ["Production of ATP", "Protection of the viral genome", "Protein synthesis", "Cellular respiration"], "a": 1, "k": "viral capsid"}, {"n": 11, "l": 1, "q": "Which of the following correctly describes fungi?", "o": ["Prokaryotic organisms with peptidoglycan walls", "Eukaryotic organisms with chitin-containing cell walls", "non-cellular infectious agents", "Organisms without genetic material"], "a": 1, "k": "describes fungi"}, {"n": 12, "l": 1, "q": "Yeasts are generally characterized by:", "o": ["Being single-celled organisms that reproduce by budding", "Being non-cellular organisms", "Producing peptidoglycan cell walls", "Reproducing exclusively by binary fission"], "a": 0, "k": "Yeasts"}, {"n": 13, "l": 1, "q": "Molds are characterized by:", "o": ["Being non-cellular infectious agents", "Being large, fuzzy, multicellular organisms that produce spores", "Having no cell wall", "Reproducing exclusively by binary fission"], "a": 1, "k": "Molds"}, {"n": 14, "l": 1, "q": "Normal flora refers to:", "o": ["Microorganisms that always cause disease", "Microorganisms inhabiting the skin and mucous membranes of healthy individuals", "Microorganisms found exclusively in contaminated water", "Microorganisms that cannot survive inside humans"], "a": 1, "k": "Normal flora"}, {"n": 15, "l": 1, "q": "Colonization is best defined as:", "o": ["Destruction of microorganisms by immune cells", "Establishment and proliferation of microorganisms on skin or mucous membranes without signs or symptoms", "Invasion of the bloodstream by microorganisms", "Complete elimination of normal flora"], "a": 1, "k": "Colonization"}, {"n": 16, "l": 1, "q": "An opportunistic pathogen is best described as a microorganism that:", "o": ["Always causes disease in healthy individuals", "Cannot inhabit the human body", "May cause disease when host defenses are impaired", "Is always beneficial to the host"], "a": 2, "k": "opportunistic pathogen"}, {"n": 17, "l": 1, "q": "The ability of normal flora to prevent pathogen growth by competing for nutrients and attachment sites is called:", "o": ["Colonization resistance", "Binary fission", "Pathogenesis", "Endocytosis"], "a": 0, "k": "competing for"}, {"n": 18, "l": 1, "q": "Which cellular structure is responsible for separating the genetic material of eukaryotic cells from the cytoplasm?", "o": ["Cell wall", "Nuclear membrane", "Plasma membrane", "Ribosome"], "a": 1, "k": "separating"}, {"n": 19, "l": 1, "q": "According to the lecture, which eukaryotic organisms lack a cell wall?", "o": ["Fungi and algae", "Plants and fungi", "Animals and protozoans", "Plants and bacteria"], "a": 2, "k": "lack a cell wall"}, {"n": 20, "l": 1, "q": "Bacteria arranged in grape-like clusters are called:", "o": ["Streptococci", "Diplococci", "Staphylococci", "Tetrads"], "a": 2, "k": "grape-like clusters"}, {"n": 21, "l": 1, "q": "Which of the following is NOT a characteristic of viruses?", "o": ["They are non-cellular.", "They contain either DNA or RNA.", "They possess independent cellular metabolism.", "They require host cells for replication."], "a": 2, "k": "NOT"}, {"n": 22, "l": 1, "q": "Why are viruses unable to multiply independently?", "o": ["They lack genetic material.", "They lack the cellular machinery required for independent replication.", "They contain no proteins.", "They cannot enter living cells."], "a": 1, "k": "unable to multiply independently"}, {"n": 23, "l": 1, "q": "Which statement correctly describes the nucleic acid of bacteria compared with viruses?", "o": ["Both contain o acterized as:", "o": ["Lipopolysaccharides found exclusively in Gram-negative bacteria", "Secreted bacterial polypeptides", "Components of the bacterial outer membrane", "Substances released only after bacterial cell lysis"], "a": 1, "k": "Exotoxins"}, {"n": 66, "l": 2, "q": "In the AB structure of many exotoxins, the A subunit is responsible for:", "o": ["Binding to the host cell receptor", "Toxic or enzymatic activity", "Protecting the bacterial chromosome", "Producing bacterial capsules"], "a": 1, "k": "A subunit"}, {"n": 67, "l": 2, "q": "Which component of lipopolysaccharide (LPS) is responsible for the toxic effects of endotoxin?", "o": ["O antigen", "Core polysaccharide", "Lipid A", "Peptidoglycan"], "a": 2, "k": "toxic effects of endotoxin"}, {"n": 68, "l": 2, "q": "What percentage of water in bacterial cell?", "o": ["30%", "50%", "70%", "90%"], "a": 2, "k": "percentage of water"}, {"n": 69, "l": 2, "q": "Which glycocalyx form is thick and tightly attached to the cell wall?", "o": ["Slime layer", "Capsule", "Fimbria", "Flagellum"], "a": 1, "k": "thick and tightly attached"}, {"n": 70, "l": 2, "q": "Gram-positive bacteria have:", "o": ["Thin peptidoglycan layer", "Thick multilayered peptidoglycan", "No cell wall", "An outer membrane containing LPS"], "a": 1, "k": "Gram-positive"}, {"n": 71, "l": 2, "q": "Teichoic acids are characteristic of:", "o": ["Gram-positive bacteria", "Gram-negative bacteria", "Mycoplasma only", "Viruses"], "a": 0, "k": "Teichoic acids"}, {"n": 72, "l": 2, "q": "Gram-positive bacteria appear after Gram staining.", "o": ["Pink/red", "Purple", "Green", "Yellow"], "a": 1, "k": "after Gram staining"}, {"n": 73, "l": 2, "q": "The bacterial cell membrane is primarily a:", "o": ["Protein monolayer", "Phospholipid bilayer", "Peptidoglycan layer", "Polysaccharide capsule"], "a": 1, "k": "bacterial cell membrane"}, {"n": 74, "l": 2, "q": "Which organism has sterols in its cell membrane to provide stability because it lacks a cell wall?", "o": ["Bacillus", "Mycoplasma", "Streptococcus", "Escherichia coli"], "a": 1, "k": "sterols"}, {"n": 75, "l": 2, "q": "The bacterial chromosome is usually:", "o": ["Linear and double nucleus-bound", "Single and circular DNA", "RNA only", "Multiple linear chromosomes"], "a": 1, "k": "bacterial chromosome"}, {"n": 76, "l": 2, "q": "The bacterial chromosome is located in the:", "o": ["Nucleus", "Mitochondria", "Nucleoid", "Ribosome"], "a": 2, "k": "chromosome is located"}, {"n": 77, "l": 2, "q": "Which plasmid is associated with antibiotic resistance?", "o": ["F-plasmid", "R-plasmid", "Col-plasmid", "Virulence plasmid"], "a": 1, "k": "antibiotic resistance"}, {"n": 78, "l": 2, "q": "Bacterial ribosomes are:", "o": ["80S", "90S", "70S", "60S"], "a": 2, "k": "Bacterial ribosomes"}, {"n": 79, "l": 2, "q": "The bacterial 70S ribosome consists of:", "o": ["40S + 30S", "50S + 30S", "60S + 40S", "70S + 30S"], "a": 1, "k": "70S ribosome consists"}, {"n": 80, "l": 2, "q": "Which genera are mentioned in the lecture as examples of bacteria that form endospores?", "o": ["Streptococcus and Staphylococcus", "Bacillus and Clostridium", "Escherichia and Salmonella", "Mycoplasma and Mycobacterium"], "a": 1, "k": "endospores"}, {"n": 81, "l": 2, "q": "Which type of pilus is involved in DNA transfer during conjugation?", "o": ["Attachment pilus", "Sex pilus", "Flagellum", "Fimbria"], "a": 1, "k": "DNA transfer during conjugation"}, {"n": 82, "l": 2, "q": "What is the main function of bacterial flagella?", "o": ["Protein synthesis", "Motility", "DNA storage", "Capsule formation"], "a": 1, "k": "flagella"}, {"n": 83, "l": 2, "q": "A bacterium with numerous flagella distributed over its entire surface is described as:", "o": ["Monotrichous", "Amphitrichous", "Lophotrichous", "Peritrichous"], "a": 3, "k": "entire surface"}, {"n": 84, "l": 2, "q": "Which Staphylococcus species is coagulase-positive?", "o": ["Staphylococcus epidermidis", "Staphylococcus saprophyticus", "Staphylococcus aureus", "All Staphylococcus species"], "a": 2, "k": "coagulase-positive"}, {"n": 85, "l": 2, "q": "Which enzyme breaks down hydrogen peroxide into water and oxygen?", "o": ["Coagulase", "Catalase", "β-lactamase", "Streptokinase"], "a": 1, "k": "hydrogen peroxide"}, {"n": 86, "l": 2, "q": "Staphylococcus aureus can grow in the presence of approximately:", "o": ["1–2% NaCl", "5% NaCl only", "10–15% NaCl", "25–30% NaCl"], "a": 2, "k": "grow in the presence"}, {"n": 87, "l": 2, "q": "Which component of S. aureus reduces phagocytosis?", "o": ["Protein A", "Flagellin", "Streptokinase", "Hyaluronidase"], "a": 0, "k": "reduces phagocytosis"}, {"n": 88, "l": 2, "q": "Which toxin is associated with staphylococcal food poisoning?", "o": ["Streptolysin O", "Enterotoxin", "Streptokinase", "M protein"], "a": 1, "k": "food poisoning"}, {"n": 89, "l": 2, "q": "Toxic shock syndrome caused by S. aureus is associated with:", "o": ["TSST / Enterotoxin F", "Protein A only", "Streptolysin O", "Hyaluronic acid capsule"], "a": 0, "k": "Toxic shock syndrome"}, {"n": 90, "l": 2, "q": "Streptococci are typically arranged in:", "o": ["Grape-like clusters", "Chains or pairs", "Spiral chains", "Cubical packets only"], "a": 1, "k": "typically arranged"}, {"n": 91, "l": 2, "q": "Which hemolysis produces greenish discoloration on blood agar?", "o": ["Alpha hemolysis", "Beta hemolysis", "Gamma hemolysis", "No hemolysis"], "a": 0, "k": "greenish discoloration"}, {"n": 92, "l": 2, "q": "Which organism is an example of an alpha-hemolytic streptococcus?", "o": ["S. pyogenes", "S. agalactiae", "S. pneumoniae", "S. epidermidis"], "a": 2, "k": "alpha-hemolytic"}, {"n": 93, "l": 2, "q": "Which organism is a Group A beta-hemolytic streptococcus?", "o": ["S. pyogenes", "S. agalactiae", "S. pneumoniae", "S. epidermidis"], "a": 0, "k": "Group A beta-hemolytic"}, {"n": 94, "l": 2, "q": "What is the most important virulence factor of S. pyogenes?", "o": ["Protein A", "M protein", "Coagulase", "Catalase"], "a": 1, "k": "most important virulence factor"}, {"n": 95, "l": 2, "q": "The hyaluronic acid capsule of S. pyogenes is described as:", "o": ["Strongly immunogenic", "non-immunogenic and antiphagocytic", "Responsible for antibiotic resistance", "An enzyme that dissolves fibrin"], "a": 1, "k": "hyaluronic acid capsule"}, {"n": 96, "l": 2, "q": "Which streptolysin is oxygen-labile?", "o": ["Streptolysin O", "Streptolysin S", "Streptokinase", "Pyrogenic exotoxin"], "a": 0, "k": "oxygen-labile"}, {"n": 97, "l": 2, "q": "Acute rheumatic fever usually follows:", "o": ["Streptococcal pharyngitis", "Staphylococcal food poisoning", "Urinary tract infection caused by S. saprophyticus", "Scalded skin syndrome"], "a": 0, "k": "rheumatic fever"}, {"n": 98, "l": 2, "q": "Acute glomerulonephritis usually follows which infection", "o": ["Pyoderma", "Dental caries", "Toxic shock syndrome", "Bacterial endocarditis only"], "a": 0, "k": "glomerulonephritis"}];
const LN={1:'الملف 1 · الأطول هو الصح',2:'الملف 2 · باقي الأسئلة'};
const LC={1:'var(--l1)',2:'var(--l2)'};
const MAXN=Math.max(...Q.map(q=>q.n));
const cfg={lec:new Set([1,2]),from:1,to:MAXN,random:false,kw:true,instant:true,shuf:false};
let run=null;
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=q=>{if(!cfg.kw||!q.k)return esc(q.q);const i=q.q.toLowerCase().indexOf(q.k.toLowerCase());if(i<0)return esc(q.q);return esc(q.q.slice(0,i))+'<mark class="kw" tabindex="0" role="button" title="كلمة مفتاحية: افتكر الإجابة المرتبطة بيها">'+esc(q.q.slice(i,i+q.k.length))+'</mark>'+esc(q.q.slice(i+q.k.length))};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>Q.filter(q=>cfg.lec.has(q.l)&&q.n>=cfg.from&&q.n<=cfg.to);

function setup(){
 run=null;
 const cnt=l=>Q.filter(q=>q.l===l).length;
 app.innerHTML=`<div class="hero"><div class="dish" aria-hidden="true"></div><div><h1>بنك أسئلة الميكروبيولوجي</h1><p class="sub">${Q.length} سؤال MCQ. اختار الملف والنطاق وابدأ.</p></div></div>
 <div class="panel"><h2>الملفات</h2><div class="chips">${[1,2].map(l=>`<button class="chip" data-l="${l}" aria-pressed="${cfg.lec.has(l)}"><span class="sw" style="background:${LC[l]}"></span><span><b>${LN[l]}</b><small>${cnt(l)} سؤال</small></span><span class="ck">✓</span></button>`).join('')}</div></div>
 <div class="panel"><h2>النطاق</h2><div class="row">
 <div><label class="f" for="from">من سؤال</label><input id="from" type="number" min="1" max="${MAXN}" value="${cfg.from}"></div>
 <div><label class="f" for="to">إلى سؤال</label><input id="to" type="number" min="1" max="${MAXN}" value="${cfg.to}"></div>
 </div>
 <div class="info"><span id="avail"></span><button class="link" id="all">تحديد الكل (1–${MAXN})</button></div></div>
 <div class="panel"><h2>ترتيب الأسئلة</h2><div class="seg"><button data-r="0" aria-pressed="${!cfg.random}">مرتب</button><button data-r="1" aria-pressed="${cfg.random}">عشوائي</button></div>
 <div style="margin-top:10px"><label class="tg"><span>إظهار الإجابة الصحيحة فورًا بعد كل سؤال</span><input type="checkbox" id="instant" ${cfg.instant?'checked':''}></label>
 <label class="tg"><span>خلط ترتيب الاختيارات A B C D</span><input type="checkbox" id="shuf" ${cfg.shuf?'checked':''}></label></div></div>
 <div class="panel"><h2>المظهر</h2><div class="seg"><button data-th="light" aria-pressed="${curTheme()==='light'}">فاتح</button><button data-th="dark" aria-pressed="${curTheme()==='dark'}">داكن</button></div></div>
 <button class="btn" id="go">ابدأ الاختبار</button>`;
 const upd=()=>{const n=pool().length;$('avail').textContent=`المتاح: ${n} سؤال`;$('go').disabled=!n};
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const l=+b.dataset.l;cfg.lec.has(l)?cfg.lec.delete(l):cfg.lec.add(l);b.setAttribute('aria-pressed',cfg.lec.has(l));upd()});
 $('from').oninput=e=>{cfg.from=+e.target.value||1;upd()};
 $('to').oninput=e=>{cfg.to=+e.target.value||MAXN;upd()};
 $('all').onclick=()=>{cfg.from=1;cfg.to=MAXN;cfg.lec=new Set([1,2]);setup()};
 app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cfg.random=b.dataset.r==='1';app.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 app.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.th);app.querySelectorAll('[data-th]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 $('instant').onchange=e=>cfg.instant=e.target.checked;
 $('shuf').onchange=e=>cfg.shuf=e.target.checked;
 $('go').onclick=()=>begin(pool());
 upd();
}
function begin(list,keep){
 list=list.slice();
 if(!keep){if(cfg.random)shuffle(list)}
 run={i:0,done:false,items:list.map(q=>{let idx=q.o.map((_,k)=>k);if(cfg.shuf)shuffle(idx);return{q,idx,pick:null}})};
 quiz();
}
const right=it=>it.pick!==null&&it.idx[it.pick]===it.q.a;
function quiz(){
 const it=run.items[run.i],q=it.q,n=run.items.length,locked=(cfg.instant&&it.pick!==null)||!!it.shown;
 app.innerHTML=`<div class="top"><b>سؤال ${run.i+1} من ${n}</b><span><button class="link" id="tt">${curTheme()==='dark'?'وضع فاتح':'وضع داكن'}</button> <button class="link" id="quit">خروج</button></span></div>
 <div class="dots">${run.items.map((x,k)=>`<button class="dot ${x.pick===null?'':cfg.instant?(right(x)?'ok':'no'):'ans'} ${k===run.i?'cur':''}" data-k="${k}" aria-label="سؤال ${k+1}"></button>`).join('')}</div>
 <div class="qcard"><span class="tag" style="background:${LC[q.l]}">File ${q.l} · Q${q.n}</span><p class="qt"><span class="qn">${q.n}.</span>${hl(q)}</p>
 ${it.idx.map((oi,p)=>{let c='';if(locked){if(oi===q.a)c='ok';else if(p===it.pick)c='no'}else if(p===it.pick)c='sel';return`<button class="opt ${c}" data-p="${p}" ${locked?'disabled':''}><span class="L">${'ABCD'[p]}</span><span>${esc(q.o[oi])}</span></button>`}).join('')}</div>
 ${it.shown?`<div class="ansbox">الإجابة الصحيحة: <b>${'ABCD'[it.idx.indexOf(q.a)]}</b> — ${esc(q.o[q.a])}</div>`:''}<div class="nav"><button class="btn alt" id="prev" ${run.i?'':'disabled'}>السابق</button><button class="btn alt" id="show" ${cfg.instant&&it.pick!==null?'disabled':''}>${it.shown?'إخفاء الإجابة':'عرض الإجابة'}</button><button class="btn" id="next">${run.i===n-1?'إنهاء وعرض النتيجة':'التالي'}</button></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.pick=+b.dataset.p;quiz()});
 app.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{run.i=+b.dataset.k;quiz()});
 $('prev').onclick=()=>{run.i--;quiz()};
 $('show').onclick=()=>{it.shown=!it.shown;quiz()};
 $('next').onclick=()=>{if(run.i===n-1){const un=run.items.filter(x=>x.pick===null).length;if(un&&!confirm(`فيه ${un} سؤال بدون إجابة. تنهي الاختبار؟`))return;result()}else{run.i++;quiz()}};
 $('quit').onclick=()=>{if(confirm('تخرج من الاختبار؟ النتيجة هتضيع.'))setup()};
 $('tt').onclick=()=>{setTheme(curTheme()==='dark'?'light':'dark');quiz()};
 window.scrollTo(0,0);
}
function result(wrongOnly){
 const n=run.items.length,ok=run.items.filter(right).length,pct=Math.round(ok/n*100);
 const col=pct>=75?'var(--ok)':pct>=50?'var(--amber)':'var(--bad)';
 const msg=pct>=90?'ممتاز':pct>=75?'جيد جدًا':pct>=50?'كويس، راجع الأخطاء':'محتاج مراجعة تانية';
 const list=wrongOnly?run.items.filter(x=>!right(x)):run.items;
 app.innerHTML=`<div class="res"><h1>${msg}</h1><div class="ring" style="background:conic-gradient(${col} ${pct*3.6}deg,var(--line) 0)"><div>${pct}%</div></div><p class="sub">${ok} صح من ${n} · ${n-ok} غلط</p></div>
 <div class="acts">${ok<n?`<button class="btn" id="rw">إعادة الأسئلة الغلط فقط (${n-ok})</button>`:''}<button class="btn alt" id="again">إعادة نفس الأسئلة</button><button class="btn alt" id="new">اختبار جديد</button></div>
 <div class="panel"><h2>مراجعة ${wrongOnly?'الأخطاء':'كل الأسئلة'}</h2><button class="link" id="tog">${wrongOnly?'عرض الكل':'عرض الأخطاء فقط'}</button></div>
 ${list.map(it=>{const q=it.q,pk=it.pick===null?null:q.o[it.idx[it.pick]];return`<div class="rv ${right(it)?'good':''}"><p><b>F${q.l}·Q${q.n}.</b> ${esc(q.q)}</p><p class="${right(it)?'g':'y'}">إجابتك: ${pk===null?'لم تجب':esc(pk)}</p>${right(it)?'':`<p class="g">الصحيحة: ${esc(q.o[q.a])}</p>`}</div>`}).join('')}`;
 if($('rw'))$('rw').onclick=()=>begin(run.items.filter(x=>!right(x)).map(x=>x.q),true);
 $('again').onclick=()=>begin(run.items.map(x=>x.q),true);
 $('new').onclick=setup;
 $('tog').onclick=()=>result(!wrongOnly);
 window.scrollTo(0,0);
}
function curTheme(){return document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}}
try{const st=localStorage.getItem('theme');if(st)document.documentElement.setAttribute('data-theme',st)}catch(e){}
setup();
</script>
</body>
</html>
